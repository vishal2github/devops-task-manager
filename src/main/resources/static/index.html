<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Task Manager</title>
<style>
:root {
  font-family: Inter, system-ui, Arial, sans-serif;
  color: #172033;
  background: #f3f6fc;
}
* { box-sizing: border-box; }
body { margin: 0; }
header {
  background: #142544; color: white; padding: 22px 6%;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap;
}
header h1 { margin: 0; font-size: 23px; }
header p { margin: 6px 0 0; color: #b9c8e2; font-size: 13px; }
main { max-width: 1000px; margin: 32px auto; padding: 0 18px; }
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 16px; margin-bottom: 22px;
}
.card {
  background: white; border: 1px solid #e1e7f0;
  border-radius: 14px; padding: 20px;
  box-shadow: 0 4px 18px #243b5310;
}
.stat-label { color: #68758c; font-size: 13px; }
.stat-number { font-size: 30px; font-weight: 750; margin-top: 8px; }
h2 { margin-top: 0; font-size: 19px; }
input, textarea {
  display: block; width: 100%; padding: 12px;
  margin: 10px 0; border: 1px solid #d5dce8;
  border-radius: 8px; font: inherit;
}
textarea { resize: vertical; min-height: 75px; }
button {
  padding: 10px 14px; border: 0; border-radius: 8px;
  cursor: pointer; font-weight: 650; font-size: 13px;
}
.primary { background: #3168e8; color: white; }
.secondary { background: #eaf0fc; color: #254e9f; }
.danger { background: #fff0f0; color: #bc3030; }
button:disabled { opacity: .5; cursor: wait; }
.task-list { display: grid; gap: 12px; margin-top: 16px; }
.task {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 15px; border: 1px solid #e4e9f2; border-radius: 10px;
  padding: 16px;
}
.task h3 { margin: 0 0 7px; overflow-wrap: anywhere; }
.task p { margin: 0 0 10px; color: #69758a; font-size: 14px;
  white-space: pre-wrap; overflow-wrap: anywhere; }
.task.done h3 { text-decoration: line-through; color: #8590a3; }
.actions { display: flex; flex-wrap: wrap; gap: 7px; }
.badge {
  display: inline-block; padding: 4px 8px; border-radius: 20px;
  background: #e5f7ed; color: #197448; font-size: 11px;
}
.badge.pending { background: #fff4d9; color: #936400; }
#message { min-height: 22px; color: #bd3232; font-size: 13px; }
#message.success { color: #15803d; }
#health { font-size: 12px; color: #b9c8e2; }
.empty { color: #778399; text-align: center; padding: 24px; }
@media(max-width: 600px) {
  .stats { grid-template-columns: 1fr; }
  .task { flex-direction: column; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>🚀 DevOps Task Manager</h1>
    <p>Build. Ship. Deploy. Repeat.</p>
  </div>
  <span id="health">Checking application...</span>
</header>

<main>
  <section class="stats">
    <div class="card">
      <div class="stat-label">Total Tasks</div>
      <div class="stat-number" id="total">0</div>
    </div>
    <div class="card">
      <div class="stat-label">Pending</div>
      <div class="stat-number" id="pending">0</div>
    </div>
    <div class="card">
      <div class="stat-label">Completed</div>
      <div class="stat-number" id="completed">0</div>
    </div>
  </section>

  <section class="card">
    <h2 id="formTitle">Create a task</h2>
    <form id="taskForm">
      <input id="title" placeholder="Task title (required)"
             maxlength="150" required>
      <textarea id="description" placeholder="Description (optional)"
                maxlength="2000"></textarea>
      <div class="actions">
        <button class="primary" id="saveButton" type="submit">
          Add task
        </button>
        <button class="secondary" id="cancelButton" type="button"
                hidden>Cancel edit</button>
      </div>
    </form>
    <p id="message" role="status"></p>
  </section>

  <section class="card" style="margin-top:22px">
    <h2>Your tasks</h2>
    <div id="tasks" class="task-list">
      <p class="empty">Loading tasks...</p>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let tasks = [];
let editingId = null;
let busy = false;

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      ...(options.body ? {'Content-Type': 'application/json'} : {}),
      ...options.headers
    }
  });

  if (!response.ok) {
    let message = `Request failed (${response.status})`;
    try {
      const body = await response.json();
      message = body.detail || body.message || body.error || message;
    } catch {}
    throw new Error(message);
  }

  return response.status === 204 ? null : response.json();
}

function message(text = '', type = 'error') {
	const element = $('message');
	element.textContent = text;
	
	element.classList.toggle('success', type === 'success');
}

function render() {
  $('total').textContent = tasks.length;
  $('completed').textContent = tasks.filter(t => t.completed).length;
  $('pending').textContent = tasks.filter(t => !t.completed).length;

  const container = $('tasks');
  container.replaceChildren();

  if (!tasks.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = 'No tasks yet. Create your first task!';
    container.append(empty);
    return;
  }

  for (const task of tasks) {
    const article = document.createElement('article');
    article.className = 'task' + (task.completed ? ' done' : '');

    const content = document.createElement('div');
    content.style.flex = '1';

    const heading = document.createElement('h3');
    heading.textContent = task.title;

    const description = document.createElement('p');
    description.textContent = task.description || 'No description';

    const badge = document.createElement('span');
    badge.className = 'badge' + (task.completed ? '' : ' pending');
    badge.textContent = task.completed ? 'COMPLETED' : 'PENDING';

    content.append(heading, description, badge);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const toggle = document.createElement('button');
    toggle.className = 'secondary';
    toggle.textContent = task.completed ? 'Reopen' : 'Complete';
    toggle.onclick = () => toggleTask(task);

    const edit = document.createElement('button');
    edit.className = 'secondary';
    edit.textContent = 'Edit';
    edit.onclick = () => editTask(task);

    const remove = document.createElement('button');
    remove.className = 'danger';
    remove.textContent = 'Delete';
    remove.onclick = () => deleteTask(task);

    actions.append(toggle, edit, remove);
    article.append(content, actions);
    container.append(article);
  }
}

async function loadTasks() {
  try {
    tasks = await api('/api/tasks');
    render();
    $('health').textContent = '● Application connected';
  } catch (error) {
    $('health').textContent = '● API unavailable';
    message(error.message);
  }
}

$('taskForm').addEventListener('submit', async event => {
  event.preventDefault();
  if (busy) return;

  const title = $('title').value.trim();
  if (!title) {
    message('Please enter a task title.');
    return;
  }

  const payload = {
    title,
    description: $('description').value.trim(),
    completed: editingId !== null
      ? tasks.find(t => t.id === editingId)?.completed ?? false
      : false
  };

  busy = true;
  $('saveButton').disabled = true;

  try {
    if (editingId !== null) {
      await api('/api/tasks/' + editingId, {
        method: 'PUT', body: JSON.stringify(payload)
      });
    } else {
      await api('/api/tasks', {
        method: 'POST', body: JSON.stringify(payload)
      });
    }

    resetForm();
    message('Saved successfully.', 'success');
    await loadTasks();
  } catch (error) {
    message(error.message);
  } finally {
    busy = false;
    $('saveButton').disabled = false;
  }
});

function editTask(task) {
  editingId = task.id;
  $('title').value = task.title;
  $('description').value = task.description || '';
  $('formTitle').textContent = 'Edit task';
  $('saveButton').textContent = 'Save changes';
  $('cancelButton').hidden = false;
  $('title').focus();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function resetForm() {
  editingId = null;
  $('taskForm').reset();
  $('formTitle').textContent = 'Create a task';
  $('saveButton').textContent = 'Add task';
  $('cancelButton').hidden = true;
}

$('cancelButton').onclick = () => {
  resetForm();
  message();
};

async function toggleTask(task) {
  try {
    await api('/api/tasks/' + task.id, {
      method: 'PUT',
      body: JSON.stringify({
        title: task.title,
        description: task.description || '',
        completed: !task.completed
      })
    });
    await loadTasks();
  } catch (error) {
    message(error.message);
  }
}

async function deleteTask(task) {
  if (!confirm(`Delete "${task.title}"?`)) return;

  try {
    await api('/api/tasks/' + task.id, {method: 'DELETE'});
    if (editingId === task.id) resetForm();
    message('Task deleted.');
    await loadTasks();
  } catch (error) {
    message(error.message);
  }
}

loadTasks();
</script>
</body>
</html>
